<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Admins')}"></head>

<body>
<div th:replace="~{fragments/layout :: navbar('admins', ${loggedInAdmin})}"></div>

<main class="container narrow">
    <a th:href="@{/admin/admins}" class="back-link">&larr; Back to administrators</a>
    <h1 th:text="${adminId == null} ? 'New admin' : 'Edit admin'">New admin</h1>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <!-- Create -->
    <form th:if="${adminId == null}" th:action="@{/admin/admins}" th:object="${adminForm}"
          method="post" class="card form-card">
        <div class="form-row">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}">
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>
        <div class="form-row">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}">
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <div class="form-row">
            <label for="role">Role</label>
            <select id="role" th:field="*{role}">
                <option value="ADMIN">ADMIN</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>
        </div>
        <div class="form-row checkbox-row">
            <label for="active">Active</label>
            <input type="checkbox" id="active" th:field="*{active}">
        </div>
        <div class="form-row">
            <button type="submit" class="btn-primary">Create admin</button>
        </div>
    </form>

    <!-- Update -->
    <form th:if="${adminId != null}" th:action="@{/admin/admins/{id}/update(id=${adminId})}"
          th:object="${adminForm}" method="post" class="card form-card">
        <div class="form-row">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}">
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>
        <div class="form-row">
            <label for="password">New password</label>
            <input type="password" id="password" th:field="*{password}">
            <p class="hint">Leave blank to keep the current password.</p>
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <div class="form-row">
            <label for="role">Role</label>
            <select id="role" th:field="*{role}">
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>
        <div class="form-row checkbox-row">
            <label for="active">Active</label>
            <input type="checkbox" id="active" th:field="*{active}">
        </div>
        <div class="form-row">
            <button type="submit" class="btn-primary">Save changes</button>
        </div>
    </form>
</main>
</body>
</html>
