<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Admins')}"></head>

<body>
<div th:replace="~{fragments/layout :: navbar('admins', ${loggedInAdmin})}"></div>

<main class="container">
    <div class="card-header page-heading">
        <h1>Administrators</h1>
        <a th:href="@{/admin/admins/new}" class="btn-primary">Add admin</a>
    </div>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <section class="card">
        <table class="table">
            <thead>
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(admins)}">
                <td colspan="5" class="empty-cell">No administrators.</td>
            </tr>
            <tr th:each="admin : ${admins}">
                <td th:text="${admin.username}">admin</td>
                <td th:text="${admin.role}">ADMIN</td>
                <td>
                    <span class="badge"
                          th:classappend="'badge-' + (${admin.active} ? 'active' : 'closed')"
                          th:text="${admin.active} ? 'ACTIVE' : 'DISABLED'">ACTIVE</span>
                </td>
                <td th:text="${#temporals.format(admin.dateCreated, 'dd MMM yyyy')}">date</td>
                <td class="actions">
                    <a th:href="@{/admin/admins/{id}/edit(id=${admin.id})}" class="btn-small">Edit</a>
                    <form th:action="@{/admin/admins/{id}/delete(id=${admin.id})}" method="post"
                          class="inline"
                          onsubmit="return confirm('Delete this admin account?');">
                        <button type="submit" class="btn-small btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
