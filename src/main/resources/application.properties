spring.application.name=banking-system
server.port=8080

# Load values from .env at project root (optional, so app also starts in container without it)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL - values come from .env or container environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:banking_system}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

# Allow PUT/DELETE style forms where needed
spring.mvc.hiddenmethod.filter.enabled=true